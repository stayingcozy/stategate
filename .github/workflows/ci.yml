name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libyaml-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev xvfb
      - run: cmake -S . -B build && cmake --build build -j4
      - name: Canvas editor YAML edits
        run: build/medit_test examples/posture/posture.yaml
      - name: Gate the posture example
        run: build/stategate -C examples/posture gate
      - name: Gate the C posture example
        run: build/stategate -C examples/posture_c gate
      - name: Red paths
        run: scripts/redpaths.sh
      - name: MCP server smoke test
        run: scripts/mcp_smoke.py
      - name: Viewer smoke test
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" build/stategate-view examples/posture --send POWER_ON,CALIBRATED --screenshot "$PWD/viewer.png" 2> viewer.err
          test -s viewer.png
          HOME="$RUNNER_TEMP" xvfb-run -a -s "-screen 0 1440x900x24" build/stategate-view --screenshot "$PWD/home.png" 2> home.err
          test -s home.png
          if grep "^clay:" viewer.err home.err; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: |
            viewer.png
            home.png

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit # the runner's Git for Windows and Rust
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-mesa
      - run: cmake -S . -B build -G Ninja && cmake --build build
      - name: Canvas editor YAML edits
        run: build/medit_test.exe examples/posture/posture.yaml
      - name: Gate the posture example (from PowerShell, no MSYS2)
        shell: pwsh
        run: |
          build\stategate.exe -C examples/posture gate
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Architect confirmations need a person
        shell: pwsh
        run: |
          Copy-Item -Recurse examples/posture $env:RUNNER_TEMP/p
          (Get-Content $env:RUNNER_TEMP/p/posture.yaml -Raw).Replace("max: 3 }", "max: 2 }") | Set-Content -NoNewline $env:RUNNER_TEMP/p/posture.yaml
          $out = "sign off" | build\stategate.exe -C $env:RUNNER_TEMP/p signoff 2>&1 | Out-String
          if ($out -notmatch "refused") { Write-Output $out; exit 1 }
          $env:STATEGATE_APP_CONFIRM = "1"
          $out = "sign off" | build\stategate.exe -C $env:RUNNER_TEMP/p signoff 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Output $out; exit 1 }
      - name: MCP server answers over stdio
        shell: pwsh
        run: |
          $in = '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"status","arguments":{}}}'
          $out = $in | build\stategate.exe -C examples/posture mcp | Out-String
          if ($out -notmatch '"isError":false') { Write-Output $out; exit 1 }
      - name: Viewer smoke test (Mesa's software OpenGL)
        run: |
          cp "$MINGW_PREFIX"/bin/opengl32.dll "$MINGW_PREFIX"/bin/libgallium_wgl.dll build/
          export GALLIUM_DRIVER=llvmpipe # the runner has no GPU
          rc=0
          build/stategate-view.exe examples/posture --send POWER_ON,CALIBRATED --screenshot "$(cygpath -m "$PWD")/viewer-windows.png" > viewer.out 2>&1 || rc=$?
          if [ $rc -ne 0 ] || [ ! -s viewer-windows.png ]; then echo "exit $rc"; tail -40 viewer.out; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-screenshot-windows
          path: viewer-windows.png
