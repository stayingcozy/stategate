name: ci
on: [push, pull_request]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libyaml-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev xvfb
      - run: cmake -S . -B build && cmake --build build -j4
      - name: Gate the posture example
        run: build/stategate -C examples/posture gate
      - name: Red paths
        run: scripts/redpaths.sh
      - name: MCP server smoke test
        run: scripts/mcp_smoke.py
      - name: Viewer smoke test
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" build/stategate-view examples/posture --send POWER_ON,CALIBRATED --screenshot "$PWD/viewer.png" 2> viewer.err
          test -s viewer.png
          HOME="$RUNNER_TEMP" xvfb-run -a -s "-screen 0 1440x900x24" build/stategate-view --screenshot "$PWD/home.png" 2> home.err
          test -s home.png
          if grep "^clay:" viewer.err home.err; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: |
            viewer.png
            home.png
